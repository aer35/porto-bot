# Builds the image, pushes it to GHCR, and releases when VERSION has a new MAJOR.MINOR.
name: build-push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.version.outputs.release }}
      minor: ${{ steps.version.outputs.minor }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The VERSION file decides the version and whether this is a release.
      # Only a MAJOR.MINOR with no release yet is one; a patch is not.
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -v '^[[:space:]]*#' VERSION | tr -d '[:space:]')
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::VERSION must be semver, got '$v'"; exit 1; }
          base=${v%%-*}
          mm=${base%.*}
          # Pre-releases are excluded, so 1.1.0-beta does not block the 1.1.0 release.
          if gh release list --limit 100 --exclude-pre-releases \
               --json tagName -q '.[].tagName' | grep -q "^v${mm//./\\.}\." \
             || gh release view "v$v" >/dev/null 2>&1; then
            echo "::notice::v$mm is already released, so $v publishes no release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "minor=$mm" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/porto-bot
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # A version with a hyphen in it (1.1.0-beta) is published as a pre-release.
  release:
    needs: image
    if: github.event_name == 'push' && needs.image.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.image.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: v${{ env.V }}
          prerelease: ${{ contains(needs.image.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            Image: `ghcr.io/${{ github.repository_owner }}/porto-bot:${{ env.V }}`

  # A patch gets no release of its own; it is appended to the MAJOR.MINOR release it fixes.
  patch-notes:
    needs: image
    if: github.event_name == 'push' && needs.image.outputs.release == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.image.outputs.version }}
      MM: ${{ needs.image.outputs.minor }}
      SUBJECT: ${{ github.event.head_commit.message }}
    steps:
      - run: |
          tag=$(gh release list --limit 100 --json tagName -q '.[].tagName' \
                  --repo "$GITHUB_REPOSITORY" | grep "^v${MM//./\\.}\." | head -1)
          if [[ -z $tag ]]; then
            echo "::notice::no v$MM release to append $V to"
            exit 0
          fi
          body=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          # One "Patches" list, appended to on every patch after the first.
          [[ $body == *"## Patches"* ]] || body+=$'\n\n## Patches'
          body+=$'\n'"- **$V** — $(head -1 <<< "$SUBJECT") (\`ghcr.io/${GITHUB_REPOSITORY_OWNER}/porto-bot:$V\`)"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$body"
          echo "::notice::appended $V to $tag"
