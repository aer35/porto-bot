services:
  porto-bot:
    image: ghcr.io/aer35/porto-bot:latest
    # Fixed container name, so it reads the same on every host instead of picking up the folder
    # name. It must be unique on the machine: for a second copy, change the service name and this
    # to match, e.g. porto-bot-2.
    container_name: porto-bot
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped

  # Development: `docker compose --profile dev up porto-bot-dev`. Name the service, or the
  # production bot starts too and both answer every command. Separate volume, so dev data stays apart.
  porto-bot-dev:
    profiles: [dev]
    container_name: porto-bot-dev
    build:
      context: .
      target: build
    command: npx tsx watch src/index.ts
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - dev-data:/data

volumes:
  data:
  dev-data:
